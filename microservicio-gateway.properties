#Configuration config client
spring.config.import=configserver:http://localhost:8889/
spring.cloud.config.fail-fast=true

#Configuration de Oauth2 / Keycloack
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/realm-ecommerce

#Configuration Gateway
spring.cloud.gateway.server.webflux.routes[0].id=microservicio-venta
spring.cloud.gateway.server.webflux.routes[0].uri=lb://MICROSERVICIO-VENTA
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/ventas/**


spring.cloud.gateway.server.webflux.routes[1].id=microservicio-stock
spring.cloud.gateway.server.webflux.routes[1].uri=lb://MICROSERVICIO-STOCK
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/stock/**
